<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>LOLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: scene outline on the left, the script as a stack of shot slots in the middle,
     and a chat tab on the right edge that slides open next to the board. One dark look, like a grading suite. */
  :root {
    --ground: #e9ebec;
    --panel: #f4f5f5;
    --raise: #ffffff;
    --line: #c9cdd0;
    --line-soft: #d8dbdd;
    --ink: #1c2023;
    --dim: #545c62;
    --faint: #848c92;
    --accent: #6d3fc9;
    --accent-ink: #ffffff;
    --mist: rgba(109, 63, 201, 0.07);
    --scrim: rgba(28, 32, 35, 0.5);
    --void: #101213;
    --ok: #3f8a3a;
    --redo: #c43d2a;
    --todo: #848c92;
    --f-display: 'Big Shoulders Display', 'Avenir Next Condensed', 'Arial Narrow', Impact, sans-serif;
    --f-ui: 'IBM Plex Sans', -apple-system, system-ui, 'Helvetica Neue', 'Segoe UI', sans-serif;
    --f-script: 'Courier Prime', 'Courier New', Courier, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font: 14px/1.5 var(--f-ui); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

  /* top bar */
  .top { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 22px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .mark { margin: 0; font: 800 28px/1 var(--f-display); letter-spacing: 0.26em; text-transform: uppercase; color: var(--accent); }
  .tab { position: relative; padding: 4px 18px; background: transparent; border: 0; border-radius: 4px; color: var(--dim); font-weight: 500; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tab[data-new="1"]::after { content: ""; position: absolute; top: 4px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .mark small { display: block; margin-top: 3px; font: 500 10px/1 var(--f-ui); letter-spacing: 0.22em; color: var(--dim); }
  .p-bar { flex: 1; max-width: 260px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .p-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .p-redo { color: var(--redo); white-space: nowrap; }
  .save { color: var(--faint); font-size: 12px; }
  .save[data-bad="1"] { color: var(--redo); }
  .btn { padding: 6px 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 4px; }
  .btn:hover { border-color: var(--faint); }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.danger[data-armed] { border-color: var(--redo); color: var(--redo); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .restore-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 51; border-color: var(--accent); }

  /* shell */
  .shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 264px minmax(0, 1fr) var(--chatw, 0px); }
  .app[data-chat="open"] { --chatw: 400px; }
  .o-mov { margin: 16px 8px 4px; font: 700 12px var(--f-display); letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; }
  .o-mov:first-child { margin-top: 4px; }
  .o-item { display: grid; grid-template-columns: 2.2ch minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; background: transparent; border: 0; border-radius: 4px; text-align: left; }
  .o-item:hover { background: var(--raise); }
  .o-no { color: var(--accent); font: 700 12px var(--f-ui); font-variant-numeric: tabular-nums; }
  .o-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 12px var(--f-script); }
  .o-count { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .o-item[data-done="1"] .o-count { color: var(--ok); }

  .main { overflow-y: auto; min-width: 0; background: radial-gradient(900px 380px at 72% -140px, var(--mist), transparent 70%), transparent; }
  .chip { padding: 3px 11px; background: transparent; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: 12px; }
  .chip[aria-pressed="true"] { color: var(--ink); background: var(--raise); border-color: var(--faint); }
  .chip .n { margin-left: 4px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .movement { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 18px; margin: 46px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--line); text-wrap: balance; }
  .movement:first-child { margin-top: 22px; }
  .mv-no { font: 700 13px var(--f-display); letter-spacing: 0.22em; color: var(--dim); }
  .mv-title { font: 800 clamp(26px, 4vw, 40px)/1 var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; }

  .scene { padding-top: 26px; scroll-margin-top: 56px; }
  .scene-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
  .sc-no { min-width: 2.2ch; font: 800 24px/1 var(--f-display); letter-spacing: 0.06em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .sc-title { flex: 1; min-width: min(100%, 220px); padding: 4px 6px; background: transparent; border: 1px solid transparent; border-radius: 3px; font: 700 15px var(--f-script); color: var(--ink); }
  .sc-title:hover, .sc-title:focus { border-color: var(--line); }
  .sc-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .sc-more { margin-top: 8px; }
  .sc-more summary { cursor: pointer; color: var(--faint); font-size: 12px; width: fit-content; }
  .sc-more .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-top: 8px; }

  .shots { display: grid; gap: 12px; margin-top: 12px; }
  .shot { padding: 12px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 6px; }
  .shot.is-sel { border-color: var(--accent); }
  .shot-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 8px; }
  .shot-no { font: 600 11px var(--f-ui); letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  .label { flex: 1; min-width: min(100%, 140px); padding: 3px 6px; background: transparent; border: 1px solid transparent; border-radius: 3px; font-size: 13px; }
  .label:hover, .label:focus { border-color: var(--line); }
  .label::placeholder { color: var(--faint); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; background: transparent; border: 0; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .seg button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
  .seg [data-s="todo"] { --c: var(--todo); }
  .seg [data-s="shot"] { --c: var(--ok); }
  .seg [data-s="redo"] { --c: var(--redo); }
  .shot-tools { display: flex; gap: 4px; margin-left: auto; }

  .shot-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
  .txt { display: block; width: 100%; min-height: 76px; padding: 8px 10px; background: var(--ground); border: 1px solid var(--line-soft); border-radius: 4px; resize: none; overflow: hidden; font: 400 14.5px/1.55 var(--f-script); }
  .txt:focus { border-color: var(--faint); }

  .clip { min-width: 0; display: flex; flex-direction: column; gap: 6px; border-radius: 4px; }
  .clip.over { outline: 2px dashed var(--accent); outline-offset: 3px; }
  .clip video { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: var(--void); border-radius: 4px; }
  .drop { display: grid; place-content: center; gap: 4px; width: 100%; aspect-ratio: 16 / 9; padding: 12px; background: transparent; border: 1px dashed var(--faint); border-radius: 4px; color: var(--dim); text-align: center; font-size: 12px; }
  .drop strong { color: var(--ink); font-weight: 600; font-size: 13px; }
  .drop:hover { border-color: var(--accent); }
  .drop.static { cursor: default; }
  .clip-row { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .clip-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .clip-msg { margin: 0; min-height: 0; color: var(--dim); font-size: 12px; }
  .clip-msg:empty { display: none; }
  .clip-msg[data-bad="1"] { color: var(--redo); }

  .more { margin-top: 10px; }
  .more summary { cursor: pointer; color: var(--dim); font-size: 12px; width: fit-content; }
  .more .dot { display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; margin-top: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field label { color: var(--faint); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  .field input, .field textarea { width: 100%; padding: 6px 8px; background: var(--ground); border: 1px solid var(--line-soft); border-radius: 4px; }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input:focus, .field textarea:focus { border-color: var(--faint); }

  .empty { padding: 70px 0; text-align: center; color: var(--dim); }
  .empty h2 { margin: 0 0 6px; font: 800 28px var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); }
  .empty p { margin: 0 auto 14px; max-width: 46ch; }
  .end { padding-top: 28px; text-align: center; }
  .ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); font-size: 12px; color: var(--dim); }
  .ctx strong { color: var(--ink); }
  .ctx-label { letter-spacing: 0.12em; text-transform: uppercase; font-size: 10px; color: var(--faint); }
  .ctx-text { flex: 1; min-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-script); }
  .msgs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px; }
  .msg .who { margin-bottom: 3px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user .body { padding: 8px 10px; background: var(--raise); border-radius: 6px; }
  .msg.err .body { color: var(--redo); }
  .msg-actions { display: flex; gap: 6px; margin-top: 6px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
  .frame-chip { display: flex; align-items: center; gap: 10px; margin: 0 16px 8px; padding: 6px; background: var(--raise); border-radius: 4px; font-size: 12px; color: var(--dim); }
  .frame-chip img { width: 64px; height: 36px; object-fit: cover; border-radius: 3px; background: var(--void); }
  .frame-chip span { flex: 1; min-width: 0; }
  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 140px; padding: 8px 10px; background: var(--ground); border: 1px solid var(--line); border-radius: 4px; resize: none; }
  .composer textarea:focus { border-color: var(--faint); }

  .saved-note { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 6px; font-size: 12px; }
  .by-claude { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .changes { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); }
  .changes h3 { margin: 0 0 4px; font: 700 13px var(--f-display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
  .changes .lead { margin-bottom: 8px; font-size: 12px; }
  .change { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .change .what { flex: 1; min-width: min(100%, 220px); overflow-wrap: anywhere; }
  .change time { color: var(--faint); font-size: 12px; }

  @media (max-width: 1100px) {
    .shell { grid-template-columns: 240px minmax(0, 1fr); }
    .app[data-chat="open"] { --chatw: 0px; }
  }
  @media (max-width: 760px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .mark { font-size: 24px; }
  }
  @media (prefers-reduced-motion: no-preference) {
  }

  /* ---- Master tab ---- */
  .mst { display: none; }
  .app[data-view="master"] .mst { display: block; flex: 1; min-height: 0; overflow-y: auto; }
  .app[data-view="master"] .shell { grid-template-columns: minmax(0, 1fr); }
  .app[data-view="master"] .main { overflow: hidden; display: flex; flex-direction: column; }
  .m-wrap { max-width: 980px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 32px) 90px; }
  .m-wrap h2 { margin: 0 0 8px; font: 800 clamp(26px, 4vw, 40px)/1 var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; }
  .m-lead { margin: 0 0 18px; max-width: 66ch; color: var(--dim); }
  .m-drop { display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; width: 100%; padding: 34px 16px; background: var(--panel); color: var(--ink); border: 2px dashed var(--line); border-radius: 8px; cursor: pointer; font: inherit; }
  .m-drop span { color: var(--dim); font-size: 12px; }
  .m-drop:hover, .mst.over .m-drop { border-color: var(--accent); background: var(--mist); }
  .mst.has .m-drop { padding: 12px 16px; flex-direction: row; gap: 12px; }
  .m-panel { display: none; margin-top: 16px; }
  .mst.has .m-panel { display: block; }
  .m-file { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  .m-wave { display: block; width: 100%; height: 130px; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .m-tr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 10px 0 6px; }
  .m-ab { display: inline-flex; gap: 4px; }
  .m-ab .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .m-chk { font-size: 12px; color: var(--dim); display: inline-flex; align-items: center; gap: 4px; }
  .m-time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  .m-status { min-height: 18px; font-size: 12px; color: var(--ok); }
  .m-status[data-busy="1"] { color: var(--accent); }
  .md-f { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; color: var(--dim); }
  .md-f > span { flex: 0 0 104px; }
  .md-f input[type="text"], .md-song input { flex: 1; min-width: 0; padding: 5px 8px; background: var(--raise); border: 1px solid var(--line); border-radius: 4px; }
  .md-h { margin: 12px 0 2px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .md-song { display: grid; grid-template-columns: 2.4ch minmax(0, 1.4fr) minmax(0, 1fr) 64px; gap: 6px; align-items: center; margin: 4px 0; font-size: 12px; color: var(--dim); }
  .md-song input { width: 100%; }
  .md-cover { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 12px; color: var(--dim); }
  .md-cover img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
  @media (max-width: 760px) { .md-song { grid-template-columns: 2.4ch minmax(0, 1fr) 56px; } .md-song input:nth-of-type(2) { grid-column: 2 / 4; } .md-f > span { flex-basis: 84px; } }
  .m-prog { display: none; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin: 4px 0 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 6px; }
  .m-prog[data-on="1"] { display: flex; }
  .m-pbar { flex: 1 1 160px; min-width: 120px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .m-pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .m-pread { flex: 1 1 100%; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; line-height: 1.5; }
  .m-pread b { color: var(--ink); font-weight: 600; }
  .m-stats { margin: 10px 0 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .m-alb { margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; } .m-alb summary { cursor: pointer; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: var(--accent); }
  .m-albrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 10px 0; } .m-albrow .m-row { display: flex; align-items: center; gap: 6px; margin: 0; } .m-albrow input[type=number] { width: 80px; background: var(--ground); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  .eq-ov { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.74); display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 18px; }
  .eq-pn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; width: min(800px, 100%); }
  .eq-cv { width: 100%; height: auto; touch-action: none; cursor: crosshair; border-radius: 4px; display: block; }
  .eq-tbl { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px; margin-top: 10px; font-size: 12px; }
  .eq-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; border: 1px solid var(--line-soft); padding: 5px 8px; border-radius: 5px; } .eq-row b { flex: 1 1 100%; color: var(--accent); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .eq-row input[type=number] { width: 72px; background: var(--ground); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; } .eq-pn .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  button, .btn, .tab, [role="tab"], .pchip { transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease; }
  button:not(:disabled):hover, .btn:not(:disabled):hover { transform: translateY(-1px); }
  button:not(:disabled):active, .btn:not(:disabled):active { transform: scale(.95); }
  .pop { animation: dmpop .34s cubic-bezier(.2, 1.7, .4, 1); }
  @keyframes dmpop { 0% { transform: scale(1); } 35% { transform: scale(.9); } 100% { transform: scale(1); } }
  @keyframes dmshim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .m-pbar i { background-image: linear-gradient(90deg, transparent 0, rgba(255,255,255,.4) 50%, transparent 100%); background-size: 200% 100%; animation: dmshim 1.3s linear infinite; }
  .m-card, .m-alt tr { animation: dmfade .35s ease both; } @keyframes dmfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pop, .m-pbar i, .m-card, .m-alt tr { animation: none !important; } button, .btn { transition: none; } }
  .m-pend { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; margin: 0 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; transition: border-color .2s, box-shadow .2s; }
  .m-pend[data-on="1"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--mist); } .m-pend[data-on="1"] .m-pendtxt { color: var(--accent); font-weight: 600; } .m-pendtxt { flex: 1 1 220px; font-size: 13px; color: var(--dim); }
  .m-alt .m-pbar { min-width: 120px; height: 6px; margin: 2px 0; } .m-alt .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .m-alwrap { overflow-x: auto; } .m-alt { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; } .m-alt th { text-align: left; color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; } .m-alt td { padding: 5px 8px; border-top: 1px solid var(--line-soft); white-space: nowrap; }
  .m-alsum { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; margin: 10px 0; font-size: 13px; } .m-alsum span { color: var(--dim); }
  .m-sr { display: grid; grid-template-columns: 1.3fr 1fr 1fr; padding: 7px 12px; font-size: 13px; border-top: 1px solid var(--line-soft); }

<style id="lola-bunny">
  @keyframes lolaWig { 0%,100% { transform: rotate(0) translateY(0); } 50% { transform: rotate(-4deg) translateY(-3px); } }
  .app[data-page="mastering"] .m-wrap h2 { cursor: pointer; display: block; width: fit-content; margin-left: auto; margin-right: auto; }
  .btn.accent, .app[data-page="mastering"] .m-mode button[aria-pressed="true"] {
    background-image: linear-gradient(100deg, #6d3fc9 0%, #8a63d8 50%, #6d3fc9 100%);
    background-size: 250% 100%; animation: lolaSheen 12s ease-in-out infinite;
  }
  @keyframes lolaSheen { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .app[data-page="mastering"] .m-alb > summary { animation: lolaHue2 14s ease-in-out infinite; }
  @keyframes lolaHue2 { 0%,100% { color: #6d3fc9; } 50% { color: #8a63d8; } }
  .m-wrap h2 span { display: inline-block; }
  .m-wrap h2.lola-hover span { animation: lolaWig .9s ease-in-out infinite; }
</style>
<style id="lola-polish">
  .app[data-page="mastering"] audio { width: 100%; height: 44px; border-radius: 999px; background: #eef0f1; box-shadow: 0 4px 16px rgba(60,50,90,.06); }
  .app[data-page="mastering"] audio::-webkit-media-controls-panel { background: #eef0f1; border-radius: 999px; }
  .app[data-page="mastering"] select {
    -webkit-appearance: none; appearance: none; font: inherit; font-size: 14px; color: #1c2023;
    background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236d3fc9' stroke-width='1.8' stroke-linecap='round'/></svg>") no-repeat right 14px center;
    border: 1px solid #c9cdd0; border-radius: 999px; padding: 8px 38px 8px 16px;
  }
  .app[data-page="mastering"] select:focus { outline: none; border-color: #6d3fc9; box-shadow: 0 0 0 4px rgba(109,63,201,.18); }
  .btn.accent, .app[data-page="mastering"] .m-mode button[aria-pressed="true"] {
    background-color: transparent !important;
    background-image: linear-gradient(100deg, #6d3fc9 0%, #9a7ad6 50%, #6d3fc9 100%) !important;
    background-size: 250% 100% !important;
    animation: lolaSheen 12s ease-in-out infinite !important;
  }
</style>
<style id="lola-bg">
  /* the whitish-grey background slowly drifts */
  @keyframes lolaBgShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  body {
    background: linear-gradient(120deg, #e6e8ea 0%, #f5f6f7 30%, #e1e4e7 60%, #eef0f2 85%, #e6e8ea 100%) !important;
    background-size: 300% 300% !important;
    animation: lolaBgShift 10s ease-in-out infinite !important;
  }
  /* the purple sheen moves faster */
  .btn.accent, .app[data-page="mastering"] .m-mode button[aria-pressed="true"] {
    animation: lolaSheen 5s ease-in-out infinite !important;
  }
</style>
<style id="lola-extras">
  /* mastering progress: the filled part shimmers and glows */
  .m-prog i { background: linear-gradient(90deg, #6d3fc9, #a07fe0, #6d3fc9) !important; background-size: 200% 100% !important; animation: lolaSheen 2.2s linear infinite; box-shadow: 0 0 12px rgba(109,63,201,.45); }
  /* cards lift a little on hover */
  .app[data-page="mastering"] .m-card, .app[data-page="mastering"] .m-alb { transition: transform .25s ease, box-shadow .25s ease; }
  .app[data-page="mastering"] .m-card:hover, .app[data-page="mastering"] .m-alb:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(109,63,201,.14); }
  /* drop zone: glows and the note swells while a file is dragged over it */
  .app[data-page="mastering"] .mst.over .m-drop { box-shadow: 0 0 0 6px rgba(109,63,201,.12), 0 0 30px rgba(109,63,201,.28); transition: box-shadow .2s ease; }
  .app[data-page="mastering"] .mst.over .m-drop::before { scale: 1.14; transition: scale .2s ease; }
  /* waveform brightens while the track plays */
  .m-wave { transition: filter .6s ease; }
  .m-wave.lola-playing { filter: brightness(1.12) saturate(1.15); }
  /* done: a checkmark draws itself next to the download button */
  .lola-check { display: inline-flex; align-items: center; margin-left: 8px; vertical-align: middle; }
  .lola-check svg { width: 20px; height: 20px; }
  .lola-check path { stroke: #6d3fc9; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: lolaDraw .6s ease-out .1s forwards; }
  @keyframes lolaDraw { to { stroke-dashoffset: 0; } }
</style>
</head>

function unlock(pw) {
  var raw = Uint8Array.from(atob(PAYLOAD), function (c) { return c.charCodeAt(0); });
  var salt = raw.slice(8, 16), ct = raw.slice(16), enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (base) {
    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: 600000, hash: 'SHA-256' }, base, 384);
  }).then(function (bits) {
    var b = new Uint8Array(bits);
    return crypto.subtle.importKey('raw', b.slice(0, 32), 'AES-CBC', false, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-CBC', iv: b.slice(32, 48) }, key, ct);
    });
  }).then(function (pt) { return new TextDecoder().decode(pt); });
}
/* ---- sounds (made in the browser, no audio files) ---- */
var AC = null;
var MASTER = null;
function ctx() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = 0.3; MASTER.connect(AC.destination); } return AC; }
function tone(ac, f, st, dur, gain, type) {
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, st);
  g.gain.linearRampToValueAtTime(gain, st + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
  o.connect(g); g.connect(MASTER);
  o.start(st); o.stop(st + dur + 0.1);
}
/* password screen: soft three-note chime */
function chimeSoft(ac, t0) {
  [783.99, 1046.5, 1318.51].forEach(function (f, i) {
    var st = t0 + i * 0.14;
    tone(ac, f, st, 1.8, 0.12); tone(ac, f * 2, st, 1.8, 0.03);
  });
}
/* welcome text: one ding */
function ding(ac, t0) { tone(ac, 1174.66, t0, 1.6, 0.14); tone(ac, 1174.66 * 2.4, t0, 0.8, 0.03); }
/* LOLA logo: three satisfying chimes */
function chimeThree(ac, t0) { [0, 0.22, 0.44].forEach(function (d, i) { var f = [1046.5, 1318.51, 1567.98][i]; tone(ac, f, t0 + d, 1.4, 0.13); tone(ac, f * 2, t0 + d, 0.9, 0.03); }); }
/* logo flies up and the site loads: full chime sweep */
function fullChime(ac, t0) {
  var arp = [523.25, 659.25, 783.99, 1046.5];
  arp.forEach(function (f, i) { tone(ac, f, t0 + i * 0.1, 1.6, 0.09); });
  var chord = [523.25, 659.25, 783.99, 1046.5, 1318.51];
  chord.forEach(function (f) { tone(ac, f, t0 + 0.45, 3.0, 0.07, 'triangle'); });
}
(function () {
  var i = document.getElementById('lolaPw'), g = document.getElementById('lolaGate'), busy = false;
  i.focus();
  g.addEventListener('click', function () { i.focus(); });
  i.addEventListener('input', function () {
    if (busy || i.value.trim().toUpperCase() !== 'BUNNY') return;
    busy = true; i.blur(); g.classList.add('lola-out');
    try { ctx().resume(); } catch (e) {}
    unlock('BUNNY').then(function (html) {
      setTimeout(function () {
        try {
          var t = AC.currentTime + 0.05;   /* the moment the site starts */
          ding(AC, t + 0.9);               /* welcome text appears */
          chimeThree(AC, t + 4.7);         /* LOLA logo appears */
          fullChime(AC, t + 7.7);          /* logo flies up, site loads */
        } catch (e) {}
        document.open(); document.write(html); document.close();
      }, 700);
    }).catch(function () {
      busy = false; g.classList.remove('lola-out'); i.value = ''; i.classList.add('lola-shake');
    });
  });
  i.addEventListener('animationend', function () { i.classList.remove('lola-shake'); });
})();
